name: Multi-Agent Builder Tests

on:
  push:
    branches:
      - main
    paths:
      - 'multi_agent_builder/**'
      - 'tests/multi_agent_builder/**'
      - 'pyproject.toml'
      - 'requirements/builder.txt'
  pull_request:
    paths:
      - 'multi_agent_builder/**'
      - 'tests/multi_agent_builder/**'
      - 'pyproject.toml'
      - 'requirements/builder.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/builder.txt
          python -m pip install pytest
      - name: Run tests
        run: |
          pytest tests/multi_agent_builder -q
